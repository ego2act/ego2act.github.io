</svg><text x="76" y="43" class="th">Ego2ActJudge</text></g><path class="tl" d="M310.0 54L310.0 68.0"/><g tabindex="0" data-tip="The judge only gets what a real user would have: the goal sentence, the start image and the video. There's no correct video to compare against, so any valid way of reaching the goal counts." class="tn pre" style="--i:0" transform="translate(310.0,90)"><rect x="-130.0" y="-22.0" width="260" height="44" rx="10"/><g class="ti" transform="translate(-110.0,0)"><circle cx="0" cy="0" r="7"/><circle cx="0" cy="0" r="3"/></g><text x="-94.0" y="-3" class="tt">Goal + generated video</text><text x="-94.0" y="12" class="ts">no reference video needed</text></g><path class="tl" d="M310.0 112.0L310.0 138.0"/><g tabindex="0" data-tip="First it breaks the goal into a short list of things you should be able to see happen, like 'cup filled with water' or 'lid closed', and notes which steps must come before others." class="tn pre" style="--i:1" transform="translate(310.0,160)"><rect x="-130.0" y="-22.0" width="260" height="44" rx="10"/><g class="ti" transform="translate(-110.0,0)"><path d="M-3-5h9M-3 0h9M-3 5h9"/><circle cx="-7" cy="-5" r="1"/><circle cx="-7" cy="0" r="1"/><circle cx="-7" cy="5" r="1"/></g><text x="-94.0" y="-3" class="tt">Subgoal plan</text><text x="-94.0" y="12" class="ts">with prerequisite order</text></g><path class="tl" d="M310.0 182.0V200.0M165 222.0V200.0H455V222.0"/><text x="165" y="236.0" class="tb task" text-anchor="middle">TASK COMPLETION</text><text x="455" y="236.0" class="tb phys" text-anchor="middle">PHYSICS PLAUSIBILITY</text><g tabindex="0" data-tip="Does the video even start working on this subgoal? If the right object is never touched, the subgoal stops here with the lowest score." class="tn task" style="--i:2" transform="translate(165,272.0)"><rect x="-105.0" y="-22.0" width="210" height="44" rx="10"/><g class="ti" transform="translate(-85.0,0)"><circle r="7"/><path d="M-2-3.5l5 3.5-5 3.5z"/></g><text x="-69.0" y="-3" class="tt">T1 · Initiation</text><text x="-69.0" y="12" class="ts">the action starts</text></g><path class="tl" d="M165 294.0L165 312.0"/><g tabindex="0" data-tip="Is the action carried out the right way, with the right object and in a sensible order, rather than skipping ahead or doing something else?" class="tn task" style="--i:3" transform="translate(165,334.0)"><rect x="-105.0" y="-22.0" width="210" height="44" rx="10"/><g class="ti" transform="translate(-85.0,0)"><circle cx="-5" cy="5" r="2"/><circle cx="5" cy="-5" r="2"/><path d="M-3 5h4a3 3 0 0 0 0-6h-2a3 3 0 0 1 0-6h4"/></g><text x="-69.0" y="-3" class="tt">T2 · Process</text><text x="-69.0" y="12" class="ts">carried out correctly</text></g><path class="tl" d="M165 356.0L165 374.0"/><g tabindex="0" data-tip="Does the subgoal's end result actually show up and stay, e.g. the lid is really closed at the end? Only then does the subgoal get full Task credit." class="tn task" style="--i:4" transform="translate(165,396.0)"><rect x="-105.0" y="-22.0" width="210" height="44" rx="10"/><g class="ti" transform="translate(-85.0,0)"><path d="M-5 7V-7h9l-2 3.5 2 3.5h-9"/></g><text x="-69.0" y="-3" class="tt">T3 · End state</text><text x="-69.0" y="12" class="ts">goal state reached</text></g><g tabindex="0" data-tip="Do objects stay themselves? Things shouldn't morph, duplicate, vanish or change colour between frames." class="tn phys" style="--i:2" transform="translate(455,272.0)"><rect x="-105.0" y="-22.0" width="210" height="44" rx="10"/><g class="ti" transform="translate(-85.0,0)"><path d="M-8 0s3-5 8-5 8 5 8 5-3 5-8 5-8-5-8-5z"/><circle r="2"/></g><text x="-69.0" y="-3" class="tt">P1 · Continuity</text><text x="-69.0" y="12" class="ts">objects stay the same</text></g><path class="tl" d="M455 294.0L455 312.0"/><g tabindex="0" data-tip="Does everything that moves have a reason to move? Objects shouldn't slide or fly on their own without being pushed or carried." class="tn phys" style="--i:3" transform="translate(455,334.0)"><rect x="-105.0" y="-22.0" width="210" height="44" rx="10"/><g class="ti" transform="translate(-85.0,0)"><path d="M1-7l-6 8h5l-1 6 6-8h-5z"/></g><text x="-69.0" y="-3" class="tt">P2 · Causation</text><text x="-69.0" y="12" class="ts">motion has a cause</text></g><path class="tl" d="M455 356.0L455 374.0"/><g tabindex="0" data-tip="Does the contact look physically believable: no passing through surfaces, objects sticking together, or impossible hinges?" class="tn phys" style="--i:4" transform="translate(455,396.0)"><rect x="-105.0" y="-22.0" width="210" height="44" rx="10"/><g class="ti" transform="translate(-85.0,0)"><path d="M0-7l6 3.5v7L0 7l-6-3.5v-7z"/><path d="M-6-3.5L0 0l6-3.5M0 0v7"/></g><text x="-69.0" y="-3" class="tt">P3 · Interaction</text><text x="-69.0" y="12" class="ts">contact is plausible</text></g><path class="tl" d="M455 418.0L455 436.0"/><g tabindex="0" data-tip="After the action, does the new state hold? A placed object should stay put and a closed box should stay closed." class="tn phys" style="--i:5" transform="translate(455,458.0)"><rect x="-105.0" y="-22.0" width="210" height="44" rx="10"/><g class="ti" transform="translate(-85.0,0)"><rect x="-6" y="-1" width="12" height="8" rx="1.5"/><path d="M-3.5-1v-3a3.5 3.5 0 0 1 7 0v3"/></g><text x="-69.0" y="-3" class="tt">P4 · Persistence</text><text x="-69.0" y="12" class="ts">result stays put</text></g><text x="165" y="436.0" class="tn2" text-anchor="middle">T = mean level / 3</text><text x="455" y="498.0" class="tn2" text-anchor="middle">P = mean level / 4</text><path class="tl" d="M165 444.0V514.0H455V506.0M310.0 514.0V536.0"/><g tabindex="0" data-tip="Task and Physics are scored separately, then combined with a geometric mean, so a video only scores well if it both finishes the job and does it in a physically plausible way." class="tn fin" style="--i:6" transform="translate(310.0,558.0)"><rect x="-130.0" y="-22.0" width="260" height="44" rx="10"/><g class="ti" transform="translate(-110.0,0)"><path d=
